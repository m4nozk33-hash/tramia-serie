 ${SER.map(s=>`<tr><td>${s.t}</td><td>${s.s.length}</td><td><input type="number" min="0" value="${s.free}" style="width:64px" onchange="get('${s.id}').free=+this.value"></td><td><input type="number" step=".1" value="${s.rent}" style="width:84px" onchange="get('${s.id}').rent=+this.value"></td><td><input type="number" step=".1" value="${s.buy}" style="width:84px" onchange="get('${s.id}').buy=+this.value"></td><td><input type="checkbox" checked aria-label="Publicada"></td></tr>`).join("")}</table></div>
 <p style="color:var(--mut);font-size:13px">As edições valem só nesta sessão. Criar, reordenar e excluir temporadas/episódios, upload de vídeo e capas dependem do backend.</p>
 <h2>Histórico de pedidos (exemplo)</h2><div class="box tbl"><table><tr><th>Pedido</th><th>Cliente</th><th>Série</th><th>Tipo</th><th>Valor</th></tr>${SAMPLE_ORD.map(o=>`<tr><td>${o[0]}</td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${R(o[4])}</td></tr>`).join("")}</table></div>`}
function checkout(id){const s=get(id),d=s.buy-s.rent;
 $("#md").innerHTML=`<div class="ov" onclick="if(event.target==this)closeMd()"><div class="modal"><h2 style="margin-top:0">${s.t}</h2><p style="color:var(--mut)">Continue de onde parou: escolha como liberar os episódios pagos.</p>
 <div class="g2"><div class="box"><b>Alugar</b><div class="price">${R(s.rent)}</div><small>48 horas de acesso</small><br><br><button class="btn s" onclick="unlock('${id}','rent')">Alugar (teste)</button></div>
 <div class="box best"><b>Comprar</b><div class="price">${R(s.buy)}</div><small>Série completa, só ${R(d)} a mais</small><br><br><button class="btn" onclick="unlock('${id}','buy')">Comprar (teste)</button></div></div>
 <div class="note">Checkout demonstrativo. Mercado Pago (Pix e cartão) ainda não está integrado: os botões liberam apenas um acesso de teste neste navegador, sem cobrança.</div><button class="btn s" onclick="closeMd()">Fechar</button></div></div>`}
function closeMd(){$("#md").innerHTML=""}
function unlock(id,t){S.acc[id]={type:t,exp:Date.now()+48*36e5};save();closeMd();toast("Acesso de teste liberado");render();if(P.on)draw()}
/* player */
let P={on:0},tm;
function play(id,se,ep){const s=get(id);P={on:1,s,se,ep,t:0,dur:20,pl:true,sp:1,vol:80,set:0};$("#pl").classList.add("on");clearInterval(tm);tm=setInterval(tick,250);draw()}
function nxt(d){const s=P.s;let i=idx(s,P.se,P.ep)+d;if(i<0||i>=total(s)){if(d>0)toast("Fim da série");return}
 let se=0;while(i>=s.s[se]){i-=s.s[se];se++}P.se=se;P.ep=i;P.t=0;P.pl=true;draw()}
function tick(){if(!P.on||!P.pl||locked(P.s,P.se,P.ep))return;P.t+=.25*P.sp;
 S.prog[P.s.id]={se:P.se,ep:P.ep,t:P.t};
 if(P.t>=P.dur){P.t=P.dur;if(S.mode=="auto")nxt(1);else P.pl=false;save()}const b=$("#bar");if(b){b.value=P.t;$("#tt").textContent=Math.floor(P.t)+"s / "+P.dur+"s"}}
function closePl(){P.on=0;clearInterval(tm);$("#pl").classList.remove("on");$("#pl").innerHTML="";save();render()}
function draw(){const s=P.s,lk=locked(s,P.se,P.ep),n=idx(s,P.se,P.ep)+1;
 $("#pl").innerHTML=`<div class="scr" style="${grad(s)}" id="scr"><div class="top"><button class="ib" onclick="closePl()" aria-label="Fechar">✕</button><span class="chip" style="background:#0008">T${P.se+1} · Ep ${P.ep+1}</span><button class="ib" onclick="$('#st').classList.toggle('on')" aria-label="Configurações">⚙</button></div>
 <div class="sett" id="st"><b>Modo de reprodução</b><div class="seg"><button class="${S.mode=="auto"?"on":""}" onclick="S.mode='auto';save();draw()">Automático</button><button class="${S.mode=="scroll"?"on":""}" onclick="S.mode='scroll';save();draw()">Rolagem</button></div><small style="color:var(--mut)">${S.mode=="auto"?"O próximo episódio começa sozinho.":"Deslize para cima para avançar."}</small><b>Velocidade</b><div class="seg">${[.75,1,1.5,2].map(v=>`<button class="${P.sp==v?"on":""}" onclick="P.sp=${v};draw()">${v}x</button>`).join("")}</div></div>
 ${lk?`<div class="ct" style="background:#000c"><div style="font-size:40px">🔒</div><h2 style="margin:0">Episódio premium</h2><p style="color:var(--mut)">Os ${s.free} primeiros episódios são grátis. Alugue ou compre para continuar.</p><button class="btn" onclick="checkout('${s.id}')">Ver opções</button></div>`:`<div class="ct"><small style="background:#0008;padding:4px 10px;border-radius:99px">Vídeo demonstrativo (sem arquivo real)</small><h2 style="margin:6px 0">${s.t}</h2><div style="font-size:60px;opacity:.9">${P.pl?"❚❚":"▶"}</div></div>`}
 <div class="ctr"><input type="range" id="bar" min="0" max="${P.dur}" step=".25" value="${P.t}" aria-label="Progresso" oninput="P.t=+this.value"><div class="r"><button class="ib" onclick="nxt(-1)" aria-label="Episódio anterior">⏮</button><button class="ib" onclick="P.t=Math.max(0,P.t-5)" aria-label="Voltar 5 segundos">⟲</button><button class="ib" onclick="P.pl=!P.pl;draw()" aria-label="Reproduzir ou pausar">${P.pl?"❚❚":"▶"}</button><button class="ib" onclick="P.t=Math.min(P.dur,P.t+5)" aria-label="Avançar 5 segundos">⟳</button><button class="ib" onclick="nxt(1)" aria-label="Próximo episódio">⏭</button><span id="tt" style="font-size:12px;flex:1;text-align:center">0s</span>
 <input type="range" min="0" max="100" value="${P.vol}" style="width:70px" aria-label="Volume" oninput="P.vol=this.value"><button class="ib" disabled title="Chromecast e AirPlay ainda não integrados" aria-label="Transmitir (indisponível)">📺</button><button class="ib" onclick="fav('${s.id}');draw()" aria-label="Favoritar">${S.fav.includes(s.id)?"★":"☆"}</button><button class="ib" onclick="share('${s.id}')" aria-label="Compartilhar">↗</button><button class="ib" onclick="$('#scr').requestFullscreen?.()" aria-label="Tela cheia">⛶</button></div></div></div>`;
 let y0=null;const e=$("#scr");e.ontouchstart=ev=>y0=ev.touches[0].clientY;e.ontouchend=ev=>{if(S.mode=="scroll"&&y0!=null&&y0-ev.changedTouches[0].clientY>70)nxt(1)};
 e.onwheel=ev=>{if(S.mode=="scroll"&&Math.abs(ev.deltaY)>30){ev.preventDefault();nxt(ev.deltaY>0?1:-1)}}}
let AD={sid:"amor-entre-mundos",se:0};
const EPT=["O Encontro","Novos Laços","O Segredo","A Revelação","Conflitos"];
const pubOf=(s,i)=>!s.pub||s.pub[i]===undefined?true:!!s.pub[i];
function adm(f,a){const s=get(AD.sid);
 if(f=="tg"){s.ov=s.ov||{};s.ov[a]=paid(s,a)}
 if(f=="se")AD.se=a;
 if(f=="sel"){AD.sid=a;AD.se=0}
 if(f=="ns"){s.s.push(0);s.pub=s.pub||[];s.pub[s.s.length-1]=0;AD.se=s.s.length-1}
 if(f=="ds"&&s.s.length>1){s.s.splice(a,1);if(s.pub)s.pub.splice(a,1);AD.se=0}
 if(f=="ne")s.s[AD.se]++;
 if(f=="de")s.s[AD.se]=Math.max(0,s.s[AD.se]-1);
 render()}
function admin(){const s=get(AD.sid),se=Math.min(AD.se,s.s.length-1),side=[["▣","Painel"],["▤","Séries e Doramas",1],["◫","Episódios"],["▭","Temporadas"],["◈","Categorias"],["☺","Usuários"],["▬","Pedidos e Pagamentos"],["↗","Relatórios"],["▨","Banners e Destaques"],["⚙","Configurações"]];
 const T=m=>`toast('${m}')`;
 return `<div class="adm"><aside><div class="logo" style="margin-bottom:18px" onclick="go('inicio')"><i>▶</i>Tramia</div><div class="sb">${side.map(x=>`<button class="sbi ${x[2]?"on":""}" onclick="${x[2]?"":T("Seção demonstrativa")}"><span>${x[0]}</span>${x[1]}</button>`).join("")}</div><div class="pro"><b style="font-size:20px">♛ Tramia Pro</b><p style="font-size:14px;color:var(--mut)">Sua plataforma de doramas e séries curtas com controle total.</p><button class="btn" style="width:100%" onclick="${T("Planos ainda não existem")}">Ver planos</button></div></aside>
 <section><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input placeholder="🔍 Buscar no painel..." aria-label="Buscar no painel" style="flex:1;min-width:160px;max-width:420px"><span style="flex:1"></span><select aria-label="Série" style="width:auto" onchange="adm('sel',this.value)">${SER.map(x=>`<option value="${x.id}" ${x.id==s.id?"selected":""}>${x.t}</option>`).join("")}</select><span class="av">E</span></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px"><span style="color:var(--mut);flex:1">⌂ › Séries e Doramas › <b style="color:#fff">Editar Série</b></span><button class="btn s" onclick="go('${s.id}')">↗ Visualizar na plataforma</button><button class="btn" onclick="${T("Alterações salvas só nesta sessão")}">✔ Salvar alterações</button></div>
 <div class="note">Painel demonstrativo, sem autenticação nem banco de dados. As edições valem apenas nesta sessão.</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px"><div class="f2"><div class="cv" style="${grad(s)};flex:none;width:100%">${art(s)}<div class="in" style="font:italic 700 20px Georgia,serif">${s.t}</div></div><div><h2 style="margin:0 0 4px">Editar Série</h2><label class="lb">Título da série</label><input value="${s.t}" oninput="get('${s.id}').t=this.value"><label class="lb">Categoria(s)</label><div class="chips">${s.g.split(", ").map(g=>`<span class="chip">${g} ✕</span>`).join("")}</div><label class="lb">Sinopse</label><textarea rows="4" maxlength="500" oninput="get('${s.id}').sin=this.value;document.getElementById('cnt').textContent=this.value.length+'/500'">${s.sin}</textarea><small id="cnt" style="color:var(--mut)">${s.sin.length}/500</small></div></div>
 <div class="pn" style="margin-top:0"><h3>🏷 Preços da Série</h3><label class="lb">Preço de aluguel (R$)</label><input type="number" step=".1" value="${s.rent}" onchange="get('${s.id}').rent=+this.value"><label class="lb">Duração do aluguel</label><select><option>24 horas</option><option selected>48 horas</option><option>72 horas</option></select><label class="lb">Preço de compra (R$)</label><input type="number" step=".1" value="${s.buy}" onchange="get('${s.id}').buy=+this.value"><div class="note" style="color:#e9d5ff;background:#8b3dff22;border-color:#8b3dff66"><b>Dica:</b> mantenha o valor da compra mais vantajoso para incentivar a venda.</div></div></div>
 <div class="pn" style="display:flex;gap:6px;flex-wrap:wrap">${["Temporadas","Episódios","Detalhes","Destaque","Avançado"].map((x,i)=>`<button class="sbi ${i?"":"on"}" onclick="${i?T("Aba demonstrativa"):""}">${x}</button>`).join("")}</div>
 <div class="pn"><h3>▤ Temporadas <button class="btn" onclick="adm('ns')">＋ Nova Temporada</button></h3>${s.s.map((n,i)=>`<div class="srow ${i==se?"on":""}" onclick="adm('se',${i})"><span style="color:var(--mut)">⋮⋮</span><b>Temporada ${i+1}</b><span style="color:var(--mut)">${n} episódios</span><span><span class="pill ${pubOf(s,i)?"ok":"dr"}">● ${pubOf(s,i)?"Publicada":"Rascunho"}</span></span><span><button class="ic" aria-label="Editar" onclick="event.stopPropagation();${T("Edição de temporada ainda não integrada")}">✎</button><button class="ic d" aria-label="Excluir" onclick="event.stopPropagation();adm('ds',${i})">🗑</button></span></div>`).join("")}</div>
 <div class="pn"><h3><span>🎬 Episódios – Temporada ${se+1}</span><button class="btn" onclick="adm('ne')">＋ Adicionar Episódio</button></h3><div class="tbl"><table><tr><th>#</th><th>Capa</th><th>Título do Episódio</th><th>Duração</th><th>Gratuito</th><th>Status</th><th>Ações</th></tr>${Array.from({length:s.s[se]},(_,i)=>{const gi=idx(s,se,i),pd=paid(s,gi);return `<tr><td>${i+1}</td><td><div class="th" style="${grad(s)}">${art(s)}</div></td><td>Episódio ${i+1} – ${EPT[i]||"Sem título"}</td><td>◷ 03:${String(8+(i*7)%12).padStart(2,"0")}</td><td><button class="tg ${pd?"":"on"}" role="switch" aria-checked="${!pd}" aria-label="Gratuito" onclick="adm('tg',${gi})"></button></td><td><span class="pill ${pd?"pd":"ok"}">${pd?"🔒 Pago":"● Publicado"}</span></td><td style="white-space:nowrap"><button class="ic" aria-label="Editar" onclick="${T("Edição de episódio ainda não integrada")}">✎</button><button class="ic" aria-label="Duplicar" onclick="adm('ne')">⧉</button><button class="ic d" aria-label="Excluir" onclick="adm('de')">🗑</button></td></tr>`}).join("")}</table></div>
 <div class="drop"><div class="av" style="width:64px;height:64px;font-size:26px;background:#2a1146">☁</div><div style="flex:1;min-width:200px"><b style="font-size:18px">Enviar vídeo do episódio</b><p style="margin:4px 0;color:var(--mut);font-size:14px">Arraste e solte o arquivo aqui ou clique para selecionar<br>Formatos: MP4, MOV (máx. 2 GB por episódio)</p></div><button class="btn" onclick="${T("Upload ainda não integrado a um serviço de vídeo")}">Enviar vídeo</button></div></div></section></div>`}
function adminAccessDenied(){return `<section class="modal" style="margin:42px auto;text-align:center"><h1>Área administrativa restrita</h1><p style="color:var(--mut)">O painel só será liberado para a conta administradora após a configuração da autenticação segura no Supabase. Enquanto a integração não estiver concluída, ninguém poderá acessar o painel pela versão pública.</p><button class="btn" onclick="go('inicio')">Voltar ao início</button></section>`}
/* router */
function render(){
 const h=location.hash.slice(1)||"inicio";route=h;nav();document.querySelector("header").style.display="";const a=$("#app"),s=get(h);
 a.innerHTML=s?serie(s):h=="biblioteca"?lib():h=="entrar"?auth():h=="admin"?adminAccessDenied():home();
 document.title=s?s.t+" — Tramia":"TRAMIA | Séries curtas";scrollTo(0,0)}
$("#q").oninput=e=>{term=e.target.value;if(route!="inicio")go("inicio");else render()};
addEventListener("hashchange",render);addEventListener("keydown",e=>{if(e.key=="Escape"){closeMd();if(P.on)closePl()}});
render();
</script>
</body>
</html>
